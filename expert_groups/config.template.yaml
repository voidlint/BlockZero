# Expert Group Configuration Template
#
# Copy this file to create a config for each expert group:
#   cp config.template.yaml exp_math/config.yaml
#   cp config.template.yaml exp_agentic/config.yaml
#   cp config.template.yaml exp_planning/config.yaml
#   cp config.template.yaml exp_dummy/config.yaml
#
# Then edit each file to set the correct expert_group_id and dataset settings.

data:
  # Dataset configuration
  dataset_name: "merged_math"  # Change based on expert group
  dataset_class: "expert_groups.exp_math.dataset:MergedMathDataset"  # Format: module.path:ClassName
  data_dir: null  # Set to specific directory if needed (e.g., "en" for C4)

  # Training parameters
  batch_size: 512
  sequence_length: 1024
  per_device_train_batch_size: 2
  world_size: 10
  rank: 1
  vali_fraction: 0.01  # 1% validation split

# Expert group identification
expert_group_id: 0  # 0=math, 1=agentic, 2=planning, 99=dummy
expert_group_name: "exp_math"  # exp_math, exp_agentic, exp_planning, exp_dummy

# =============================================================================
# Expert Group Settings Reference
